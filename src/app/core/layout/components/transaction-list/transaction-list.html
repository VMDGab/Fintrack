<div class="list-container">
    <div class="list-header">
        <span style="width: 15%;">Data</span>
        <span style="width: 20%;">Categoria</span>
        <span style="width: 25%;">Descrição</span>
        <span style="width: 20%;">Tipo</span>
        <span style="width: 10%;">Valor</span>
    </div>

    @for (item of transactions | async; track item.transactionId) {
        <app-transaction-item
            [date]="item.paymentDate"
            [category]="item.category.title"  
            [desc]="item.description"
            [type]="item.type"
            [amount]="item.amount"
         />
    }

    <div class="list-footer" *ngIf="transactions | async as transactions">
        <span>Mostrando {{transactions.length}}</span>
        <div class="options">
            <app-list-button buttonTitle="Anterior"/>
            <app-list-button buttonTitle="Próximo"/>
        </div>
    </div>
</div>
